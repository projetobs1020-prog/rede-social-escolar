<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conecta — Rede Escolar</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/feed.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/groups.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand"><span>✦</span> Conecta</div>
    <h1>Sua escola. Sua rede.</h1>
    <p>Uma rede social feita para a comunidade escolar.</p>
    <button class="btn google" id="googleLogin">G&nbsp; Continuar com Google</button>
    <button class="btn primary" id="demoLogin">Entrar em modo demonstração</button>
    <small>Protótipo sem backend. O Google Login será conectado futuramente.</small>
  </div>
</div>

<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="brand"><span>✦</span> Conecta</div>
    <nav id="mainNav">
      <button class="nav-btn active" data-page="feed">⌂ <span>Início</span></button>
      <button class="nav-btn" data-page="groups">◉ <span>Grupos</span></button>
      <button class="nav-btn" data-page="calendar">▣ <span>Calendário</span></button>
      <button class="nav-btn" data-page="notifications">♢ <span>Notificações</span></button>
      <button class="nav-btn" data-page="profile">◎ <span>Meu perfil</span></button>
      <button class="nav-btn admin-only" data-page="admin">⚙ <span>Administração</span></button>
    </nav>
    <div class="mini-profile"><div class="avatar">WL</div><div><b id="miniName">Aluno Demo</b><small id="miniClass">9º Ano · Verificado ✓</small></div></div>
  </aside>

  <main class="main">
    <section id="feed" class="page active"></section>
    <section id="groups" class="page"></section>
    <section id="calendar" class="page"></section>
    <section id="notifications" class="page"></section>
    <section id="profile" class="page"></section>
    <section id="admin" class="page"></section>
  </main>

  <aside class="rightbar" id="rightbar"></aside>
</div>

<div id="modal" class="modal-bg hidden"><div class="modal" id="modalContent"></div></div>
<div id="toast" class="toast"></div>
<script src="js/users/auth.js"></script>
<script src="js/feed/posts.js"></script>
<script src="js/feed/comments.js"></script>
<script src="js/feed/likes.js"></script>
<script src="js/groups/groups.js"></script>
<script src="js/groups/members.js"></script>
<script src="js/security/reports.js"></script>
<script src="js/security/moderation.js"></script>
<script src="js/security/notifications.js"></script>
<script src="js/security/calendar.js"></script>
<script src="js/security/achievements.js"></script>
<script src="js/users/profile.js"></script>
<script src="js/security/admin.js"></script>
<script src="js/app.js"></script>
</body></html>
